name: CI

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "pcb/**"
      - ".claude/skills/pcb/**"
      - ".claude/skills/konnect/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "pcb/**"
      - ".claude/skills/pcb/**"
      - ".claude/skills/konnect/**"
      - ".github/workflows/ci.yml"

jobs:
  # The supervisor contract, tested on the host. This is the job that can fail for a
  # behavioral reason — `app` only proves the wiring still compiles.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

  pcb-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:pcb-03
      - run: python3 -m unittest tools.test_tscircuit_handoff
