[target.riscv32imac-unknown-none-elf]
# Relative to `firmware/app`. Writes the rollback bootloader, the OTA partition table and
# the app (ota_0), erasing otadata; see `scripts/flash-app.sh`.
runner = "../scripts/flash-app.sh --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[build]
target = "riscv32imac-unknown-none-elf"

[env]
ESP_LOG = "info"
